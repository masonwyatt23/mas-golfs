<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mas Golfs — Hole Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
<style>
  #holeCard {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding: 36px 56px;
    animation: fadeIn .4s ease;
  }
  .hc-hole { font-size: 58px; color: var(--cream); }
  .hc-hole .gold { color: var(--gold); }
  .hc-meta { font-size: 22px; color: var(--mist); margin-top: 10px; }
  .hc-meta b { color: var(--cream); font-weight: 600; }
</style>
</head>
<body>
  <div id="holeCard" class="panel">
    <div class="display hc-hole" id="holeLine"></div>
    <div class="mono hc-meta" id="metaLine"></div>
  </div>

<script src="../shared/placeholder.js"></script>
<script src="../shared/mas-golfs.js"></script>
<script>
(function () {
  var roundState = MasGolfs.makeReplicant('roundState', MasGolfs.placeholder.roundState || {});
  var hole = MasGolfs.placeholder.holeInfo || {};

  function render(state) {
    var h = (state && state.current_hole) || {};
    var name = h.name || hole.name || '';
    var par = h.par || hole.par || '–';
    var yards = h.yards || hole.yards || '–';
    var num = (state && state.hole) || hole.hole || '–';
    document.getElementById('holeLine').innerHTML =
      'HOLE <span class="gold">' + num + '</span> — “' + name.toUpperCase() + '” · PAR ' + par + ' · ' + yards + ' YDS';
    document.getElementById('metaLine').innerHTML =
      'Wind <b>' + hole.wind_mph + ' mph ' + hole.wind_dir + '</b> · Pin <b>' + hole.pin + '</b> · '
      + (hole.elevation_ft < 0 ? 'Downhill ' : 'Uphill ') + '<b>' + Math.abs(hole.elevation_ft) + ' ft</b>';
  }

  roundState.on('change', render);
  render(roundState.value);
  MasGolfs.startDemo({ shotData: null, lastShot: null });
})();
</script>
</body>
</html>
